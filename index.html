<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cape Town Rentals | Definitive Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1f4058,#08111c 70%);color:#e9f7ff;font:16px system-ui,sans-serif}
#loading{max-width:480px;margin:20px;padding:28px 30px;border:1px solid #406078;border-radius:20px;background:#122438;box-shadow:0 20px 65px #0007}
h1{font-size:24px;margin:0 0 12px;color:#ffb36c}p{line-height:1.6}
</style></head><body><section id="loading"><h1>Cape Town Rentals</h1><p>Loading your complete car-rental management game and its artwork…</p></section>
<script>
(async function(){
  const names=Array.from({length:18},(_,i)=>'source_parts/part-'+String(i).padStart(3,'0')+'.txt');
  const load=async path=>{const response=await fetch(path);if(!response.ok)throw Error('Could not load '+path);return response.text();};
  const [sections,css,art]=await Promise.all([Promise.all(names.map(load)),load('visuals/showroom.css'),load('visuals/showroom-art.js')]);
  let game=sections.join('');
  if(game.length!==7053414||!game.includes('function bo(){'))throw Error('Game source failed its integrity check');
  game=game.replace('<title>React Artifact</title>','<title>Cape Town Rentals | Definitive Game</title>');
  game=game.replace('</style>',css+'\n</style>');
  game=game.replace('var xA=[',art+'\nvar xA=[');
  for(const [model,from,use] of [['sedan','il','Business'],['coupe','Rn','Coastal'],['truck','Rt','Logistics'],['bus','Rt','Wine Tram']]){
    game=game.replace('img:'+from+',use:"'+use+'"','img:createCapeCarArt("'+model+'"),use:"'+use+'"');
  }
  game=game.replace('className:"relative h-28 bg-black/50"','className:"relative h-28 bg-black/50 fleet-scene"');
  game=game.replace('className:"w-full h-full object-contain p-2"','className:"w-full h-full object-cover fleet-car-art"');
  game=game.replace('className:"h-14 w-full object-contain"','className:"h-14 w-full object-cover rounded-lg fleet-thumb"');
  game=game.replace('className:"min-h-screen bg-[#0a0a0a] text-white selection:bg-[#ff6b00]/30"','className:"min-h-screen game-shell text-white selection:bg-[#ff6b00]/30"');
  const start=game.indexOf('dl=()=>{let v='),end=game.indexOf(',z=new Blob([v]',start);
  if(start<0||end<0)throw Error('HTML export hook was not found');
  game=game.slice(0,start)+'dl=()=>{let v="<!DOCTYPE html>\\n"+document.documentElement.outerHTML'+game.slice(end);
  document.open();document.write(game);document.close();
})().catch(err=>{
  document.getElementById('loading').innerHTML='<h1>Game could not load</h1><p>'+String(err.message||err)+'</p><p>Open with GitHub Pages or serve the repository using a local web server. You can also run <code>python rebuild.py</code> to create a standalone playable HTML file.</p>';
  console.error(err);
});
</script></body></html>
