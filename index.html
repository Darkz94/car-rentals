/* SECTION 2 · THE COLLECTION / GARAGE & DEALERSHIP */
.fleet-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:17px}
.fleet-kpi{padding:16px 18px;background:linear-gradient(132deg,#173346,#0d2231);border:1px solid #375362;border-radius:17px;min-width:0}
.fleet-kpi small{color:#a6bfca;font-size:11px;display:block;margin-bottom:7px;font-weight:750;letter-spacing:.3px}
.fleet-kpi strong{font-size:22px;line-height:1.2;color:#f8f5e8;font-weight:900;display:block;overflow-wrap:anywhere}
.fleet-kpi em{font-style:normal;display:block;color:#9bb4c1;font-size:10px;margin-top:5px}
.fleet-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 17px;padding:13px;background:#0f2332;border:1px solid #2f4655;border-radius:17px}
.fleet-toolbar input,.fleet-toolbar select,.dealer-toolbar select,.dealer-toolbar input,.branch-chooser{min-height:39px;border-radius:11px;border:1px solid #466373;background:#172e40;color:#f3f8f6;padding:9px 11px;max-width:100%}
.fleet-toolbar input{flex:1;min-width:160px}.fleet-toolbar select{max-width:170px;flex:1;min-width:126px}
.dealer-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.dealer-toolbar label{font-size:11px;color:#b5cad1;font-weight:800;display:grid;gap:5px}.dealer-toolbar select{min-width:150px}
.fleet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}

.fleet-tile:hover{border-color:#b18c65;background:linear-gradient(132deg,#203e4d,#112a39)}
.fleet-tile.selected{border-color:#f3ba7d;box-shadow:0 0 0 1px #eab27377 inset,0 6px 27px #0003}
.fleet-tile-head{display:flex;align-items:center;gap:12px}.fleet-tile-head .car-thumb{height:87px;width:102px}.fleet-tile-head .car-thumb img{width:92px;height:83px}
.fleet-tile-name{font-weight:900;font-size:14px;color:#fff}.fleet-tile .tile-sub{font-size:11px;color:#adc4cc;margin-top:4px}
.fleet-mini-meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0 13px}
.fleet-mini-meters .fm-label{display:flex;justify-content:space-between;font-size:10px;color:#d4e0e0;gap:3px}
.fleet-mini-meters .meter{height:5px;margin:5px 0 0}
.fleet-tile-footer{display:flex;justify-content:space-between;align-items:center;gap:9px;border-top:1px solid #ffffff12;padding-top:11px}
.fleet-detail-hero{background:radial-gradient(ellipse at 90% 30%,#29515e 0%,#142b3d 65%);border:1px solid #385563;border-radius:16px;padding:13px;display:flex;gap:15px;align-items:center;margin-top:15px}
.fleet-detail-hero .car-thumb.big{width:155px;height:140px;background:transparent}.fleet-detail-hero .car-thumb.big img{height:136px;width:148px}
.fleet-tip{font-size:11px;color:#b4cbd0;line-height:1.6;background:#102c3a;border-left:3px solid #d7ae78;padding:9px 12px;border-radius:0 10px 10px 0}
.fleet-batch{display:flex;gap:7px;flex-wrap:wrap}.fleet-batch button{white-space:normal}
.dealer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dealer-card{border:1px solid #355061;background:linear-gradient(140deg,#1a3446,#122837);border-radius:19px;overflow:hidden;position:relative}
.dealer-card.locked{filter:saturate(.7)}.dealer-card.compare{border-color:#f2b779;box-shadow:0 0 0 1px #f1b87866 inset}
.dealer-visual{height:166px;background:radial-gradient(ellipse at 50% 65%,#3b596b 0,#172c3c 65%,#112533 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.dealer-visual::before{content:'';position:absolute;inset:auto -25% 0;height:1px;box-shadow:0 0 45px 30px #a2c5c01b}.dealer-visual img{width:190px;height:165px;object-fit:contain;filter:drop-shadow(0 18px 15px #0008);z-index:1}
.dealer-card-body{padding:15px}.dealer-card h3{font-weight:900;color:#fff;font-size:16px;line-height:1.2}

<style id="garage-parking-bays-desktop">

<style id="modern-arcade-edition">/* Cape Town Rentals — Modern Arcade Edition | Desktop-first, no external fonts/assets */
:root {
  --bg:#080c20;
  --surface:#111a34;
  --surface2:#182442;
  --surface3:#202e4e;
  --line:#3b4e77;

  --text:#f7fbff;
  --gold:#ffcb65;
  --orange:#ff9970;
  --green:#78f7ab;
  --cyan:#69e7fa;
  --red:#ff758f;
  --shadow:0 18px 44px #0206178a;
  --radius:20px;
  --arc-purple:#af83ff;

  --arc-blue:#488eff;

}
*,*:before,*:after{box-sizing:border-box}
body {

    radial-gradient(ellipse at 83% 1%, #2b1a58b8 0%, transparent 30%),

    radial-gradient(ellipse at 74% 98%, #2822508c 0%, transparent 32%),
    linear-gradient(180deg,#080c20,#101931 58%,#0a1025 100%);

}

.app{max-width:2100px;position:relative}

}

.logo {padding:30px 22px 23px;border-bottom:1px solid #46568380;position:relative}

}

.card:hover{border-color:#688af6a8}

.muted,.subtle{color:#b3c5e0}

.money{color:#ffd16d}
.positive{color:#8bfab1}.negative{color:#ff8b99}
/* Arcade buttons: confident tactile surfaces */
.btn,.nav-btn,.tab,.garage-view-tabs button,.map-control button{cursor:pointer}
.btn{
  position:relative;border:1px solid #5477c0;
  background:linear-gradient(180deg,#314675,#202c54);
  color:#f0f8ff;font-weight:850;border-radius:12px;
  box-shadow:0 5px 0 #0d1739,0 8px 20px #0005,inset 0 1px 0 #a3c0f824;
  transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;
}
.btn:hover:not(:disabled){transform:translateY(-2px);background:linear-gradient(180deg,#3a5da0,#273b72);border-color:#7bdaf9;box-shadow:0 7px 0 #0d1739,0 12px 23px #0006,0 0 18px #69e7fa18}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #0d1739,0 4px 12px #0005}
.btn.primary{
  background:linear-gradient(125deg,#ffe27e,#ffad6e 73%,#ff8f7e);
  color:#231a26;border-color:#fff1a4;
  box-shadow:0 5px 0 #a84a52,0 9px 20px #ff9a7d30,inset 0 1px 0 #fffdcc;
}
.btn.primary:hover:not(:disabled){background:linear-gradient(120deg,#fff1a0,#ffc079 70%,#ffa18c);box-shadow:0 7px 0 #a84a52,0 11px 23px #ff9a7d40}
.btn.green{color:#0e2932;background:linear-gradient(130deg,#bfff87,#6ef1be);border-color:#cfffba;box-shadow:0 5px 0 #238077,0 9px 20px #6effc02e}
.btn.green:hover:not(:disabled){background:linear-gradient(130deg,#d1ffa1,#88fadd)}
.btn.ghost{background:#192848c9;border-color:#4b6393;box-shadow:0 4px 0 #0b1630,inset 0 1px 0 #ffffff0b}
.btn.danger{background:linear-gradient(150deg,#722d56,#552a54);color:#ffb5cc;border-color:#dd638e}
.btn:disabled{box-shadow:none;filter:saturate(.5);opacity:.51}
input,select,textarea{
  color:#eff8ff!important;background:#151f3e!important;
  border-color:#4b6395!important;border-radius:12px!important;
}
input:focus,select:focus,textarea:focus{border-color:#73ddff!important;outline:none;box-shadow:0 0 0 3px #3fe0ff24}
select option{background:#18234a;color:white}
.pill{border-radius:9px;font-weight:900;letter-spacing:.5px}
.pill.green{background:#144d3cd9;color:#8afbbc;border:1px solid #2ec99266}
.pill.orange{background:#593523;color:#ffc18a;border:1px solid #ff9c6f66}
.pill.blue{background:#1b3766;color:#9ddfff;border:1px solid #5bbbf66b}
.pill.red{background:#5a2942;color:#ffa3b6;border:1px solid #ed669274}
.tabs{gap:7px}
.tab{background:linear-gradient(180deg,#1c2b50,#172345);border-color:#465c91;color:#bcd3ee;border-radius:11px;font-weight:850;box-shadow:0 3px 0 #0a1531}
.tab:hover{background:#2d407a;color:white;border-color:#6c8ad5}
.tab.active{background:linear-gradient(120deg,#3769cb,#5a4ebf);color:white;border-color:#70daf8;box-shadow:0 3px 0 #1f3265,0 0 19px #546ee337}
/* Dashboard: neon game atmosphere, no layout disruption */

.hero h2{font:950 clamp(35px,3.6vw,56px)/1.06 'Trebuchet MS','Segoe UI',sans-serif;letter-spacing:-1.8px;text-shadow:0 3px 17px #030b2b99}
.hero h2 i{font-style:normal;color:#ffc67d;text-shadow:0 0 22px #ffb88040}
.hero p{color:#e2e8fb;font-size:13px;line-height:1.6}
.city-status{background:linear-gradient(105deg,#172a4b,#1e2951);border-color:#456cb28c;border-radius:15px}
.stats .stat{position:relative;overflow:hidden;min-height:129px;border-radius:19px}

function carMatch(car,offer){let typ=typeOf(car.type);let needed=offer.need;

function addCar(typeId,price=null,auction=false,branch='hq'){let t=typeOf(typeId);if(t.unlock>state.rep){notify(`Reach reputation level ${t.unlock} to unlock this vehicle.`,'bad');return false;}let cap=garageCapacity();if(state.fleet.length>=cap){notify('Garage full! Buy the Garage Expansion in Business.','bad');return false;}
 let cost=price??t.price;if(!spend(cost,`Bought ${t.name}`))return false;
 let car=makeCar(typeId,owned(branch)?branch:'hq',auction?{condition:rand(45,78),clean:rand(35,80),fuel:rand(20,70)}:{});state.fleet.push(car);selectedCar=car.id;
 note(`Purchased ${t.name} • ${car.plate}${auction?' at auction':''}.`);notify(`Welcome to the fleet: ${t.name}!`);checkAchievements();return true;
}

function garageCapacity(){return state.prestige>1?100:(up('garage')?22:8);}
function carePrices(c){let t=typeOf(c.type);return {service:c.condition<99.9?(up('workshop')?0:round((850+(100-c.condition)*45)*difficulty().expenses)):0,wash:c.clean<99.9?(up('carwash')?0:round(180*difficulty().expenses)):0,fuel:c.fuel<99.9?round((100-c.fuel)/100*t.tank*fuelPrice()*(up('fuelcard')?.75:1)):0};}
function careNeeded(c){return c.condition<99.9||c.clean<99.9||c.fuel<99.9;}
function getResale(c){let t=typeOf(c.type);return round(t.price*(.38+.24*clamp(c.condition)/100)+Math.min(5,c.tune||0)*2500);}
function vehicleNeedsAttention(c){return c.status==='incident'||(c.status==='available'&&(c.fuel<25||c.condition<50||c.clean<40));}
function garageCars(){let cars=state.fleet.filter(c=>garageStatus==='all'||(garageStatus==='ready'&&carReady(c))||(garageStatus==='care'&&vehicleNeedsAttention(c))||(garageStatus==='out'&&['rented','transfer'].includes(c.status))||(garageStatus==='parked'&&c.status==='available')||(garageStatus==='incident'&&c.status==='incident'));if(garageBranch!=='all')cars=cars.filter(c=>c.branch===garageBranch);return cars.sort((a,b)=>{let x=typeOf(a.type),y=typeOf(b.type);if(garageSort==='condition')return a.condition-b.condition;if(garageSort==='earnings')return y.rate*(1+(b.tune||0)*.13)-x.rate*(1+(a.tune||0)*.13);if(garageSort==='name')return x.name.localeCompare(y.name);return TYPES.indexOf(x)-TYPES.indexOf(y);});}
function visibleDealerCars(){return TYPES.filter(t=>dealerClass==='all'||(dealerClass==='city'&&['Hatch','Sedan','Coupe','Classic'].includes(t.category))||(dealerClass==='commercial'&&['Bakkie','Van','Truck','Bus'].includes(t.category))||(dealerClass==='classic'&&t.category==='Classic')||(dealerClass==='muscle'&&t.category==='Muscle')||(dealerClass==='luxury'&&['Muscle','Sport','Super','Hyper'].includes(t.category))||(dealerClass==='unlocked'&&t.unlock<=state.rep)).sort((a,b)=>dealerSort==='price'?a.price-b.price:dealerSort==='income'?b.rate-a.rate:dealerSort==='name'?a.name.localeCompare(b.name):a.unlock-b.unlock);}
function bulkCare(mode){let candidates=state.fleet.filter(c=>c.status==='available'&&(mode==='prepare'?careNeeded(c)||c.body<99.9:mode==='service'?c.condition<99.9||c.body<99.9:mode==='wash'?c.clean<99.9:c.fuel<99.9));if(!candidates.length){notify('No parked vehicles need that service.');return false;}
 let total=candidates.reduce((sum,c)=>{let p=carePrices(c);return sum+(mode==='prepare'?p.service+p.wash+p.fuel+bodyRepairCost(c):mode==='service'?p.service+bodyRepairCost(c):p[mode]);},0);
 if(!spend(total,`Fleet ${mode} · ${candidates.length} vehicles`))return false;
 for(let c of candidates){if(mode==='service'||mode==='prepare'){if(c.condition<99.9||c.body<99.9){c.condition=100;c.body=100;c.parts=Object.fromEntries(CAR_PARTS.map(([k])=>[k,100]));state.stats.services++;}}if(mode==='wash'||mode==='prepare'){if(c.clean<99.9){c.clean=100;state.stats.washes++;}}if(mode==='fuel'||mode==='prepare'){if(c.fuel<99.9){c.fuel=100;state.stats.filled++;}}}
 note(`${candidates.length} vehicles ${mode==='prepare'?'fully prepared':mode==='service'?'serviced':mode==='wash'?'washed':'refuelled'} for ${total?money(total):'FREE'}.`);notify(`${candidates.length} cars ready · ${total?money(total):'FREE'}!`);return true;
}
function sellCar(id){let c=state.fleet.find(x=>x.id===id);if(!c){notify('Car not found.','bad');return false;}if(c.status!=='available'){notify('Only parked vehicles can be sold.','bad');return false;}if(state.fleet.length<=1){notify('Keep at least one car so your rental business can operate.','bad');return false;}
 let value=getResale(c);state.cash+=value;state.ledger.unshift({t:now(),amount:value,label:`Car sold · ${c.plate}`});state.ledger=state.ledger.slice(0,80);state.stats.sales=(state.stats.sales||0)+value;state.fleet=state.fleet.filter(x=>x.id!==id);selectedCar=state.fleet[0]?.id||null;modal=null;modalCar=null;note(`${typeOf(c.type).name} ${c.plate} sold for ${money(value)}.`);notify(`Sold ${c.plate} for ${money(value)}.`);return true;}

function fillFuel(carId){let c=state.fleet.find(x=>x.id===carId);if(!c||c.status!=='available'){notify('Vehicle must be parked before refuelling.','bad');return false;}if(c.fuel>=99.9){notify('Fuel tank is already full.');return true;}
 let cost=carePrices(c).fuel;if(!spend(cost,`Refuelled ${c.plate}`))return false;c.fuel=100;state.stats.filled++;note(`${c.plate} refuelled for ${money(cost)}.`);notify(`Tank full • ${money(cost)} ⛽`);return true;}
function allCare(carId){let c=state.fleet.find(x=>x.id===carId);if(!c||c.status!=='available')return notify('Vehicle must be parked to prepare.','bad');let p=carePrices(c),cost=p.service+p.wash+p.fuel;if(!careNeeded(c))return notify('Already fully prepared.');if(!spend(cost,`Full preparation · ${c.plate}`))return false;if(c.condition<99.9){c.condition=100;c.parts=Object.fromEntries(CAR_PARTS.map(([k])=>[k,100]));state.stats.services++;}if(c.clean<99.9){c.clean=100;state.stats.washes++;}if(c.fuel<99.9){c.fuel=100;state.stats.filled++;}note(`${c.plate} fully prepared for ${cost?money(cost):'FREE'}.`);notify(`Car ready for rent · ${cost?money(cost):'FREE'}`);return true;}
function tune(carId){let c=state.fleet.find(x=>x.id===carId);if(!c||c.status!=='available')return notify('Park the vehicle before upgrading.','bad');if(c.tune>=5)return notify('Vehicle already has maximum tuning.');let cost=round(14000*Math.pow(c.tune+1,1.65));if(!spend(cost,`Performance tuning • ${c.plate}`))return;c.tune++;note(`${c.plate} tuned to level ${c.tune}/5.`);notify(`Tuning upgraded! +13% booking value`);}
function resolveIncident(id){let inc=state.incidents.find(x=>x.id===id);if(!inc)return;let c=state.fleet.find(x=>x.id===inc.carId);let cost=up('insurance')?450:900;if(!spend(cost,`Roadside assistance • ${c?.plate||'vehicle'}`))return;state.incidents=state.incidents.filter(x=>x.id!==id);if(c)c.status='available';note(`Roadside recovery completed. ${c?.plate||'Vehicle'} back at garage. Repair any damage in Fleet.`);notify(`Roadside recovery complete • ${money(cost)}`);}
function buyUpgrade(id){let x=UPGRADES.find(v=>v.id===id);if(!x||up(id))return;if(!spend(x.price,`Business upgrade • ${x.name}`))return;state.upgrades[id]=true;note(`${x.name} purchased. ${x.subtitle}.`);notify(`Unlocked: ${x.name}!`);}
const AUTO_CARE_ROWS=[
 ['autofuel','⛽','Auto-refuel','Fills tanks below 75%. Fuel is always charged.'],
 ['autoservice','🔧','Auto-service','Services condition below 85%. Workshop makes it free.'],
 ['autowash','🫧','Auto-wash','Washes cars below 75%. Car Wash makes it free.'],
 ['autobody','🛠️','Auto-bodywork','Repairs panels below 90%. Workshop makes it free.'],
 ['autorecovery','🚨','Auto-recovery','Automatically pays for towing when an incident occurs.']
];
function careSwitch(id){return state.settings.autoCare?.[id]!==false;}
function autoCareSpend(cost,label){cost=round(cost);if(freeCash()<cost)return false;return spend(cost,label);}
function autoCareVehicle(c){
 if(!c)return false;
 let actions=[],total=0;
 if(c.status==='incident'&&up('autorecovery')&&careSwitch('autorecovery')){
   let incident=state.incidents.find(i=>i.carId===c.id);
   if(incident){let cost=up('insurance')?450:900;
     if(autoCareSpend(cost,`Automatic roadside recovery · ${c.plate}`)){
       state.incidents=state.incidents.filter(i=>i.id!==incident.id);
       c.status='available';actions.push('recovered');total+=cost;
     }
   }
 }
 if(c.status!=='available')return !!actions.length;
 let p=carePrices(c);
 if(up('autofuel')&&careSwitch('autofuel')&&c.fuel<75){
   if(autoCareSpend(p.fuel,`Automatic refuelling · ${c.plate}`)){
     c.fuel=100;state.stats.filled++;actions.push('refuelled');total+=p.fuel;
   }
 }
 if(up('autoservice')&&careSwitch('autoservice')&&c.condition<85){
   if(autoCareSpend(p.service,`Automatic servicing · ${c.plate}`)){
     c.condition=100;c.parts=Object.fromEntries(CAR_PARTS.map(([k])=>[k,100]));
     state.stats.services++;actions.push('serviced');total+=p.service;
   }
 }
 if(up('autowash')&&careSwitch('autowash')&&c.clean<75){
   if(autoCareSpend(p.wash,`Automatic wash · ${c.plate}`)){
     c.clean=100;state.stats.washes++;actions.push('washed');total+=p.wash;
   }
 }
 if(up('autobody')&&careSwitch('autobody')&&c.body<90){
   let cost=bodyRepairCost(c);
   if(autoCareSpend(cost,`Automatic bodywork · ${c.plate}`)){
     c.body=100;actions.push('bodywork repaired');total+=cost;
   }
 }
 if(actions.length){note(`Fleet-care automation: ${c.plate} ${actions.join(', ')} · ${total?money(total):'FREE'}.`);return true;}
 return false;
}

 }).join('')}</div></section>`;

 c.status='transfer';c.transferTo=branch;c.transferDue=now()+12000;c.transferFrom=c.branch;note(`${c.plate} transferring to ${DEST[branch]?.name||branch}.`);notify('Vehicle transfer started • 12 seconds');}

function takeLoan(id){let x=LOANS.find(v=>v.id===id);if(!x)return;

 state.ledger.unshift({t:now(),amount:x.amount,label:`Loan funded · ${x.name}`});state.ledger=state.ledger.slice(0,100);

 state.loans=state.loans.filter(x=>x.id!==id);state.credit=clamp((state.credit??680)+5,300,850);note(`Loan fully settled for ${money(amount)}.`);notify('Loan repaid!');return true;

function makeAuction(){let t=pick(TYPES.filter(x=>x.unlock<=state.rep && x.price<=Math.max(900000,state.cash*4)));let base=round(t.price*rand(48,68)/100);state.auction={id:uid('auction'),type:t.id,base,highest:0,bidder:'',ends:now()+75000,playerBid:0};state.lastAuctionAt=now();}
function bidAuction(){let a=state.auction;if(!a)return false;
 if(state.fleet.length>=garageCapacity()){notify('Make room in your garage before bidding.','bad');return false;}
 let bid=(a.highest||a.base)+Math.max(1000,round(a.base*.035));
 let allowed=freeCash()+bidReserve();
 if(allowed<bid){notify(`You need ${money(bid)} available to bid.`,'bad');return false;}
 a.highest=bid;a.playerBid=bid;a.bidder='You';note(`Placed bid of ${money(bid)}. This amount is now reserved.`);notify(`Bid placed: ${money(bid)} reserved until outbid or auction close.`);return true;
}
function buyAuctionNow(){let a=state.auction;if(!a)return false;let cost=round(a.base*1.5);
 // Release our own bid commitment for this one checkout; no duplicate reservation deduction.

 let previousBidder=a.bidder;a.bidder='Checking out';
 if(addCar(a.type,cost,true)){note(`Bought auction car outright for ${money(cost)}.`);makeAuction();return true;}
 a.bidder=previousBidder;return false;

  else {note('Auction closed without a purchase (insufficient funds or full garage).','bad');notify('Auction win could not be completed.','bad');}

}
function buyPerk(id){if(!['tips','prices','safety'].includes(id))return;if(state.prestigePoints<1)return notify('Earn prestige points to unlock permanent perks.','bad');if(state.perks[id]>=5)return notify('Perk at maximum rank.');state.prestigePoints--;state.perks[id]++;note(`${id} prestige perk upgraded.`);notify('Permanent perk upgraded.');}
function prestigeRun(){let allowed=state.stats.earned>=2000000&&state.stats.returned>=30&&state.rep>=10;if(!allowed){notify('Requires R2m lifetime revenue, 30 returned rentals and reputation level 10.','bad');return;}
 let pts=state.prestigePoints+2,perks={...state.perks},prestige=state.prestige+1;let s=fresh();s.prestige=prestige;s.prestigePoints=pts;s.perks=perks;state=s;selectedCar=state.fleet[0].id;note(`Prestige ${prestige} achieved. Earned 2 permanent upgrade points!`);notify('Prestige completed! +2 upgrade points.');modal=null;activePage='progress';}
function achievementsProgress(a){return a.field==='fleet'?state.fleet.length:a.field==='branches'?state.branches.length:state.stats[a.field]||0;}
function checkAchievements(){for(let a of ACHIEVEMENTS){if(state.achievements.includes(a.id))continue;if(achievementsProgress(a)>=a.target){state.achievements.push(a.id);earn(a.reward,`Achievement: ${a.name}`);note(`Achievement unlocked: ${a.name}! +${money(a.reward)}`);notify(`🏆 ${a.name} • +${money(a.reward)}`);}}}
function gameDay(){state.day++;state.daily=null;dailyRecord();let missed=false;
 const total=staffOverhead()+branchOverhead();
 if(total>0){let paid=Math.min(freeCash(),total);state.cash-=paid;state.stats.spent+=paid;
  if(paid>0)state.ledger.unshift({t:now(),amount:-paid,label:`Day ${state.day} · staff & branch overheads`});
  if(paid<total){missed=true;applyMissedPayment();note(`Could not pay ${money(total-paid)} of game-day overheads. Reputation reduced.`,'bad');}
 }
 state.loans=state.loans.filter(l=>{
  const scheduled=Math.min(l.remaining,Math.max(1,l.amount));
  const actual=round(scheduled*(staffed('accountant')?.9:1));
  if(freeCash()<actual){missed=true;applyMissedPayment();note('Loan instalment missed. Reputation reduced.','bad');return true;}
  state.cash-=actual;state.stats.spent+=actual;
  state.ledger.unshift({t:now(),amount:-actual,label:`Day ${state.day} · loan instalment${staffed('accountant')?' (10% discount)':''}`});
  l.remaining=Math.max(0,l.remaining-scheduled);l.installments=Math.max(0,l.installments-1);
  return l.remaining>0;
 });
 state.ledger=state.ledger.slice(0,100);if(!missed)state.credit=clamp((state.credit??680)+2,300,850);
 if(state.day%3===0){state.weather=pick(['Sunny','Sunny','Sunny','Windy','Cloudy','Rainy','Foggy']);note(`New weather: ${state.weather}.`);}
 if(state.day%7===0){state.rep+=1;note('Another week in business! Reputation improved.');}
}
/* OFFLINE EARNINGS — opt-in idle simulation with real return times and catch-up cap.
   It runs only when the game is opened/resumed, not in an Android background service. */
const OFFLINE_LIMIT_MS=12*60*60*1000;
const OFFLINE_MIN_MS=30000;
const OFFLINE_MAX_TRIPS=240;
function offlineHours(ms){
 const mins=Math.max(0,Math.floor(ms/60000));
 return mins>=60?`${Math.floor(mins/60)}h ${mins%60}m`:`${Math.max(1,mins)} min`;
}
function offlineBookingsEnabled(){return state.settings.offlineEarnings!==false&&up('auto')&&state.settings.autoDispatch!==false;}
function simulateOfflineBookings(start,end){
 if(!offlineBookingsEnabled())return 0;
 let trips=0,simAt=start+rand(85,170)*1000;
 offlineSimulation=true;
 try{
  while(simAt+RENTAL_MIN_SECONDS*1000<=end && trips<OFFLINE_MAX_TRIPS){
   // Existing auto-care unlocks are honoured. Fuel, repairs and towing still cost money.
   for(const car of state.fleet){autoCareVehicle(car);}
   const possible=state.fleet.filter(carReady);
   if(!possible.length)break;
   const car=pick(possible),type=typeOf(car.type);
   const customers=CUSTOMER_TYPES.filter(c=>customerUnlocked(c)&&(c.need===type.category||
      (type.category==='Sedan'&&c.need==='Hatch')||
      (['Coupe','Sport','Super','Hyper'].includes(type.category)&&['Sedan','Hatch','Coupe','Sport','Super'].includes(c.need))||
      (type.category==='Van'&&c.need==='Bakkie')||
      (type.category==='Truck'&&c.need==='Van')||
      (type.category==='Bakkie'&&c.need==='Truck')||
      (type.category==='Truck'&&c.need==='Bakkie')||
      (type.category==='Muscle'&&['Hatch','Sedan','Coupe','Sport'].includes(c.need))||
      (['Sport','Super','Hyper'].includes(type.category)&&c.need==='Muscle')||
      (type.category==='Classic'&&['Hatch','Sedan','Coupe'].includes(c.need))||
      (['Sedan','Coupe'].includes(type.category)&&c.need==='Classic')));
   const customer=customers.length?pick(customers):pick(CUSTOMER_TYPES.filter(customerUnlocked));
   const matchingContracts=CONTRACTS.filter(contract=>state.contracts.includes(contract.id)&&contract.branch===car.branch&&contract.need===type.category);
   const contract=matchingContracts.length&&Math.random()<.26?pick(matchingContracts):null;
   const seconds=rentalSeconds(),due=simAt+seconds*1000;
   if(due>end)break; // no payment before a simulated car return
   const offer={need:customer.need,customer:contract?contract.name:customer.name,
       icon:contract?contract.icon:customer.icon,dest:customer.dest,
       budget:Math.max(customer.budget,round(type.rate*1.55)),
       mult:contract?1.55*contract.premium:rand(112,175)/100,
       contract:contract?.id||null};
   const payout=rentalPayout(car,offer,seconds);
   if(payout<=0)break;
   const rental={id:uid('offline'),carId:car.id,customer:offer.customer,icon:offer.icon,
      from:car.branch,dest:offer.dest,start:simAt,due,payout,seconds,balanceVersion:2,contract:offer.contract};
   car.status='rented';
   // Reuse return bookkeeping, wear, incident chance, reputation, achievement rewards and reports.
   finishRental(rental);
   trips++;
   simAt=due+round(rand(100,225)*1000*difficulty().demand*weatherEffect().demand*(up('marketing')?.9:1)*(staffed('sales')?.9:1));
  }
 }finally{offlineSimulation=false;}
 return trips;
}
function beginOfflineCatchup(t){
 let previous=Number(state.offlineLastActiveAt||state.savedAt||t);
 if(!Number.isFinite(previous)||previous>t)previous=t;
 let elapsed=Math.max(0,t-previous);
 // Update the cursor before processing so saving/reopening cannot award the same interval again.
 state.offlineLastActiveAt=t;
 if(elapsed<OFFLINE_MIN_MS)return null;
 const baseline={cash:state.cash,earned:state.stats.earned,spent:state.stats.spent,returned:state.stats.returned};
 const activeDue=state.rentals.filter(r=>r.due<=t).length;
 // Trips already accepted while the app was open finish normally regardless of the toggle.
 restoreFinished();
 const qualified=offlineBookingsEnabled();
 const trips=qualified?simulateOfflineBookings(previous,previous+Math.min(elapsed,OFFLINE_LIMIT_MS)):0;
 return {elapsed,covered:Math.min(elapsed,OFFLINE_LIMIT_MS),activeDue,trips,qualified,
   enabled:state.settings.offlineEarnings!==false,baseline};
}
function completeOfflineCatchup(session){
 if(!session)return;
 const b=session.baseline;
 const report={elapsed:session.elapsed,covered:session.covered,
   rentals:Math.max(0,state.stats.returned-b.returned),simulated:session.trips,
   revenue:Math.max(0,state.stats.earned-b.earned),
   expenses:Math.max(0,state.stats.spent-b.spent),
   net:round(state.cash-b.cash),qualified:session.qualified,enabled:session.enabled};
 lastOfflineReport=report;
 state.lastOfflineReport=report;
 if(!session.enabled)return;
 // Report even when Auto-Dispatch isn't yet bought, explaining why idle rentals were not generated.
 if(report.rentals||session.elapsed>=120000){modal='offline';}
 note(`Welcome back: ${report.rentals} returned rentals, ${money(report.net)} net over ${offlineHours(report.covered)}.`);
 save(true);
}

function tick(){if(document.visibilityState==='hidden')return;let t=now();let offlineSession=beginOfflineCatchup(t);
 // Rentals are resolved by absolute real-world return time; no payments at dispatch.
 restoreFinished();
 for(let c of state.fleet){if(c.status==='transfer'&&c.transferDue<=t){c.status='available';c.branch=c.transferTo;c.transferTo=undefined;c.transferDue=undefined;note(`${c.plate} arrived in ${DEST[c.branch]?.name}.`);notify(`Vehicle transfer complete: ${c.plate}`);}}
 for(let c of state.fleet)autoCareVehicle(c);
 if(t-state.lastOfferAt>(up('marketing')?4800:staffed('sales')?6800:8200)*difficulty().demand*weatherEffect().demand*(isNight()?1.08:1)){state.lastOfferAt=t;if(state.offers.length<5)newOffer();}
 state.offers=state.offers.filter(x=>x.expires>t);
 for(let c of CONTRACTS){if(!state.contracts.includes(c.id))continue;if(t-(state.contractLast[c.id]||0)>=c.period*1000&&state.offers.length<6){state.contractLast[c.id]=t;newOffer(c);}}
 if(up('auto')&&state.settings.autoDispatch!==false){for(let offer of [...state.offers]){let car=bestCar(offer);if(car)startRental(offer.id,car.id,true);}}
 if(!state.auction||t>=state.auction.ends){if(state.auction)closeAuction();else makeAuction();}
 if(state.auction?.playerBid&&state.auction.bidder==='You'&&Math.random()<.025){state.auction.highest+=Math.max(1000,round(state.auction.base*.025));state.auction.bidder='Other bidder';state.auction.playerBid=0;notify('You were outbid — reserved funds are released.');}
 let totalDays=Math.max(0,Math.floor((t-state.lastDayAt)/GAME_DAY_MS));
 if(totalDays>0){let daySpans=Math.min(totalDays,4);for(let i=0;i<daySpans;i++)gameDay();state.lastDayAt+=daySpans*GAME_DAY_MS;
 // Long absences cap at four paid game days instead of causing hundreds of invisible bills.
 if(totalDays>4){state.lastDayAt=t;note('Welcome back! Overnight costs were capped at four game days.');notify('Welcome back · running costs capped during your absence.');}}

 completeOfflineCatchup(offlineSession);save();
}

<div class="biz-finance-kpis weather-kpis"><div class="biz-fin-kpi"><small>Weather rental effect</small><b>${Math.round((w.revenue-1)*100)>=0?'+':''}${Math.round((w.revenue-1)*100)}%</b><span>Applied to new offers only</span></div><div class="biz-fin-kpi"><small>Weather incident risk</small><b>${w.incidents.toFixed(2)}×</b><span>GPS and careful driving help</span></div><div class="biz-fin-kpi"><small>Weather road grime</small><b>${w.dirt.toFixed(2)}×</b><span>Wash for R0 with your Car Wash</span></div><div class="biz-fin-kpi"><small>Difficulty</small><b>${difficulty().name}</b><span>${money(fuelPrice())}/litre fuel</span></div></div>

<section class="card pad mt-16">${paneHeading('Weather guide','These conditions influence payout, incidents, customer requests and vehicle cleanliness.')}<div class="weather-guide">${Object.entries(WEATHER_EFFECTS).map(([id,x])=>`<div class="weather-guide-cell ${state.weather===id?'on':''}"><b>${x.icon} ${id}</b><small>${x.detail}</small></div>`).join('')}</div></section>`;}

function renderEvents(){let tabs=[['auctions','🏷️ Auctions'],['incidents','🚨 Roadside help'],['challenges','🎯 Challenges'],['weather','🌤️ Weather & time']];return `<div class="fadein">${featureHeading('🎟️','Every day brings a new story','Discover bargain cars, solve roadside incidents and earn bonuses from business challenges.')}<div class="mt-16">${renderTabs('events',tabs)}${activeSub.events==='auctions'?renderAuctions():activeSub.events==='incidents'?renderIncidents():activeSub.events==='weather'?renderWeather():renderChallenges()}</div></div>`;}
function renderAuctions(){

 return `<div class="biz-lead"><div><span class="biz-eyebrow">THE COASTLINE AUCTION HOUSE</span><h3>Find a bargain. Watch the clock.</h3><p>Place an offer or buy immediately. Auction cars are cheaper but arrive used and may need cleaning, fuel and service before their first rental.</p></div><div class="biz-hero-icon">🏷️</div></div>
 <div class="biz-grid2 auction-layout"><section class="card pad"><div class="section-head"><div><div class="eyebrow">TODAY'S AUCTION LOT</div><h2 class="section-title" style="font-size:23px">${esc(t.name)} · Pre-owned</h2></div><span class="pill orange">⏱ <span data-countdown-auction="1">${relativeTime(a.ends)}</span> LEFT</span></div><div class="auction-car-showcase"><img src="${CAR_IMAGES[t.id]}" alt="${esc(t.name)}"></div><div class="biz-finance-kpis auction-kpis"><div class="biz-fin-kpi"><small>Top bid</small><b>${money(a.highest||a.base)}</b></div><div class="biz-fin-kpi"><small>Dealer value</small><b>${money(t.price)}</b></div></div><div class="biz-data-line"><span>Starting price discount</span><b class="positive">${discount}% below dealership</b></div><div class="biz-data-line"><span>Leading bidder</span><b class="${leading?'positive':''}">${esc(a.bidder||'No bids yet')}</b></div>${leading?`<div class="notice success mt-16">🔒 You are leading. <b>${money(reserved)}</b> is held as a spending commitment, not yet deducted. If you win, the car is purchased for this amount; if outbid, the reserve is released.</div>`:''}
 <div class="biz-action-row mt-16">${btn('bid',`Bid ${money(bid)}`,'btn primary',freeCash()+(leading?reserved:0)<bid||state.fleet.length>=garageCapacity()?'disabled':'')}${btn('buynow',`Buy now ${money(buyNow)}`,'btn',state.cash<buyNow||state.fleet.length>=garageCapacity()?'disabled':'')}</div></section>
 <section class="card pad">${paneHeading('A smarter auction strategy','No hidden fees and no surprise charges at the start.')}<div class="step"><span class="step-num">1</span><p>Make a bid. That amount remains in the bank, but you cannot spend it elsewhere while you lead.</p></div><div class="step"><span class="step-num">2</span><p>Other bidders can outbid you before the auction ends; your reserved funds are released automatically.</p></div><div class="step"><span class="step-num">3</span><p>If you are the highest bidder when the timer ends, you pay once and receive the vehicle.</p></div><div class="biz-divider"></div><div class="notice">🔧 Workshop owners service auction cars for <b>R0</b>. 🫧 Car Wash owners clean auction cars for <b>R0</b>. Refuelling still costs money.</div><div class="biz-divider"></div><div class="biz-data-line"><span>Fleet spaces left</span><b>${Math.max(0,garageCapacity()-state.fleet.length)}</b></div><div class="biz-data-line"><span>Cash available for purchases</span><b class="money">${money(freeCash())}</b></div>${btn('page','Browse the dealership →','btn ghost block mt-16','data-id="fleet"')}</section></div>`;
}
function renderIncidents(){return `<div class="card pad">${paneHeading('Roadside assistance',`${state.incidents.length} unresolved incidents`,`<span class="pill ${state.incidents.length?'red':'green'}">${state.incidents.length?'NEEDS ACTION':'ALL CLEAR'}</span>`)}${state.incidents.length?state.incidents.map(x=>{let c=state.fleet.find(c=>c.id===x.carId);return `<div class="item-row"><div class="icon-avatar">🚨</div><div class="grow"><b>${esc(x.name)}</b><div class="small muted mt-12">${esc(c?.plate||'Vehicle')} · Recover vehicle to get it renting again</div><div class="small muted mt-12">Tow: ${money(up('insurance')?450:900)} · Repairs: ${up('workshop')?'FREE with Workshop':'paid in Garage'}</div></div>${listBtn('resolve',x.id,'Send roadside','btn primary sm')}</div>`;}).join(''):emptyState('🟢','Your fleet is running smoothly','No breakdowns right now. Well-maintained cars and GPS tracking reduce incident risk.')}<div class="notice mt-16">Workshop ownership makes maintenance and mechanical repairs free, but roadside towing is still a separate fee. Comprehensive Insurance halves towing costs.</div></div>`;}
function dailyMissions(){let d=state.day;return [{id:'rent',title:'Complete 3 customer rentals',value:Math.min(state.stats.returned%8,3),target:3,reward:'Repeat for regular cash flow'},{id:'fleet',title:'Own 5 vehicles',value:Math.min(state.fleet.length,5),target:5,reward:'More availability and variety'},{id:'branch',title:'Open a second branch',value:Math.min(state.branches.length,2),target:2,reward:'Expand your regional reach'},{id:'clean',title:'Wash 5 vehicles',value:Math.min(state.stats.washes,5),target:5,reward:'Keep your fleet presentable'}];}

function renderRoadmap(){let entries=[
 ['1','Start your rental desk',state.stats.returned>=2,'Return two cars for your first reliable cash flow.'],

function renderSettings(){return `<div class="grid two-thirds"><section class="card pad">${paneHeading('Save your company','Your game autosaves locally every few seconds and when you change anything.')}<div class="notice success">✅ Autosave ON · Saved on this browser/device. Rental return timestamps are saved too.</div><div class="settings-row"><div><b>Download backup</b><div class="small muted mt-12">Export your business to a JSON file for safekeeping.</div></div>${btn('export','⬇ Save JSON','btn primary')}</div><div class="settings-row"><div><b>Restore a backup</b><div class="small muted mt-12">Import a save exported from this redesigned edition.</div></div><label class="btn" style="cursor:pointer">⬆ Import JSON<input id="import-save" type="file" accept=".json,application/json" style="display:none" /></label></div><div class="settings-row"><div><b>New company</b><div class="small muted mt-12">Permanently erase your local save and restart the game.</div></div>${btn('reset','Reset game','btn danger')}</div></section><section class="card pad">${paneHeading('Company & difficulty','Change the challenge without erasing your fleet. Changes apply only to future rentals and costs.')}
<label class="biz-field">Company name<input id="company-name" type="text" maxlength="36" value="${esc(state.companyName||'Coastline Rentals')}" placeholder="Your business name"></label>

 if(modal==='guide'){title='How to play';body=`<div class="step"><span class="step-num">1</span><p>Go to <b>Dashboard</b>, choose a customer and press <b>Rent now</b>. The correct ready car is automatically selected.</p></div><div class="step"><span class="step-num">2</span><p>Watch the trip on <b>Live Map</b>. The customer pays after <b>20 seconds to 5 minutes</b> when the car returns.</p></div><div class="step"><span class="step-num">3</span><p>Use <b>Fleet</b> to refuel, wash and service your vehicles. Only parked cars can be maintained.</p></div><div class="step"><span class="step-num">4</span><p>In <b>Business</b>, buy a <b>Workshop</b> to make servicing and repairs free. Buy the <b>Car Wash</b> for free washing.</p></div><div class="step"><span class="step-num">5</span><p>Expand into branches, hire staff, sign contracts, win auctions and unlock prestige vehicles.</p></div>`;actions=btn('closemodal','Start playing','btn primary block');}
 if(modal==='loadslot'){let slot=Number(modalCar),v=readSlot(slot);title=`Load save Slot ${slot}?`;body=`<p>Your current autosave will be replaced by this manual checkpoint. <b>Export a JSON backup first</b> if you want to keep both.</p><div class="notice mt-16">${v?money(v.data.cash)+' · '+v.data.fleet.length+' vehicles · Day '+v.data.day:'No valid save found.'}</div>`;actions=v?btn('confirmloadslot','Yes, load checkpoint','btn primary',`data-id="${slot}"`):btn('closemodal','Cancel','btn');}
 if(modal==='sell'){let c=state.fleet.find(x=>x.id===modalCar);title='Sell this vehicle?';body=c?`<div class="fleet-detail-hero"><div class="car-thumb"><img src="${CAR_IMAGES[c.type]}" alt="Car"></div><div><strong>${esc(typeOf(c.type).name)}</strong><div class="car-plate">${esc(c.plate)}</div><div class="dealer-price">Receive ${money(getResale(c))}</div></div></div><p class="small muted mt-16">Selling permanently removes the car from your fleet. Its resale price depends on its condition and tuning. Your other cars and progress remain unchanged.</p>`:'Vehicle no longer available.';actions=c?listBtn('confirmsell',c.id,'Confirm sale','btn danger')+btn('closemodal','Keep my car','btn ghost'):btn('closemodal','Close','btn');}
 if(modal==='reset'){title='Start a new company?';body='<p>This will delete your local saved game. Export a JSON backup first if you want to return to your progress later.</p>';actions=btn('confirmreset','Yes, reset my company','btn danger')+btn('closemodal','Cancel','btn ghost');}
 if(modal==='prestige'){title='Begin a prestige run?';body='<p>This will reset your cash, fleet, branches, contracts and other progress, in exchange for two permanent prestige points. Save a backup first.</p>';actions=btn('confirmprestige','Confirm prestige','btn primary')+btn('closemodal','Cancel','btn ghost');}
 return `<div class="modal-backdrop" data-action="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" data-action="modalbody"><div class="eyebrow">CAPE TOWN RENTALS</div><h2>${title}</h2>${body}<div class="btn-group mt-16">${actions}</div></div></div>`;
}
function render(){const active= NAV.find(n=>n[0]===activePage)||NAV[0];const main=activePage==='overview'?renderOverview():activePage==='fleet'?renderFleet():activePage==='map'?renderMapPage():activePage==='business'?renderBusiness():activePage==='events'?renderEvents():renderProgress();
 document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo"><div class="logo-title">CAPE TOWN<br><em>RENTALS</em></div><div class="logo-sub">MODERN ARCADE EDITION · CAPE TOWN</div></div><div class="side-caption">COMPANY COMMAND</div><nav class="nav" aria-label="Main navigation">${NAV.map(([id,icon,label])=>`<button type="button" class="nav-btn ${id===activePage?'active':''}" data-action="page" data-id="${id}"><span class="glyph">${icon}</span>${label}</button>`).join('')}</nav><div class="sidebar-foot"><div class="flex between center"><b>${weatherEffect().icon} Day ${state.day} · ${clockInfo().label}</b><span class="pill green">1× SPEED</span></div><p>${esc(state.companyName||"Coastline Rentals")} · Rep ${state.rep} · ${state.weather}<br>${state.fleet.length} cars across ${state.branches.length} branches</p><div class="divider"></div>${btn('guide','❔ How to play','btn sm block')}</div></aside><main class="main"><div class="rotate-hint"><span class="phone-icon">📱</span>Rotate your phone sideways for the best arcade experience</div><header class="topbar"><div><div class="eyebrow">⚡ ARCADE TYCOON · ${active[2].toUpperCase()}</div><h1>${active[2]}</h1></div><div class="topmeta"><span class="chip weather">${weatherEffect().icon} ${state.weather} · Day ${state.day}</span><span class="chip cash">💰 ${money(state.cash)}</span>${btn('guide','?','btn-icon')}</div></header>${main}<footer style="display:flex;justify-content:space-between;gap:8px;color:#72909f;font-size:10px;padding:28px 2px 6px;flex-wrap:wrap"><span>© CAPE TOWN RENTALS · COASTLINE TYCOON · MODERN ARCADE EDITION</span><span>Autosaved locally · Rentals pay on return · Designed for single-player fun</span></footer></main></div><nav class="mobile-nav" aria-label="Mobile navigation">${NAV.map(([id,icon,label])=>`<button type="button" class="${id===activePage?'active':''}" data-action="page" data-id="${id}"><span>${icon}</span>${label.split(' ')[0]}</button>`).join('')}</nav>${renderModal()}`;
 lastRenderedAt=now();shouldRepaint=false;
}
function afterAction(){save(true);render();}
document.getElementById('app').addEventListener('click',e=>{
 const button=e.target.closest('[data-action]');if(!button||button.disabled)return;if(modal&&!button.closest('[role="dialog"]'))return;
 let action=button.dataset.action,id=button.dataset.id;
 if(action==='page'){if(!NAV.some(x=>x[0]===id))return;activePage=id;if(id==='business'&&!activeSub.business)activeSub.business='command';if(id==='fleet')activeSub.fleet='garage';window.scrollTo({top:0,behavior:'instant'});render();return;}
 if(action==='sub'){activeSub[button.dataset.group]=id;render();return;}
 if(action==='closemodal'){modal=null;render();return;}
 if(action==='guide'){modal='guide';render();return;}
 if(action==='selectcar'){selectedCar=id;activeSub.fleet='garage';render();return;}
 if(action==='dealerpreview'){if(!TYPES.some(t=>t.id===id))return;dealerPreview=id;render();return;}
 if(action==='dealerpaint'){if(!PAINTS[id])return;dealerPaint=id;render();return;}
 if(action==='dealerprev'||action==='dealernext'){let i=TYPES.findIndex(t=>t.id===dealerPreview);let step=action==='dealerprev'?-1:1;dealerPreview=TYPES[(i+step+TYPES.length)%TYPES.length].id;render();return;}
 if(action==='garagescene'){garageScene=['showroom','workshop','wash'].includes(id)?id:'showroom';render();return;}
 if(action==='garageprev'||action==='garagenext'){let i=state.fleet.findIndex(x=>x.id===selectedCar);let delta=action==='garageprev'?-1:1;selectedCar=state.fleet[(i+delta+state.fleet.length)%state.fleet.length]?.id;render();return;}
 if(action==='mapfocus'){mapFocus=id;notify(`${DEST[id]?.name||id} selected on map.`);render();return;}
 if(action==='zoomplus'){mapZoom=clamp(mapZoom+.25,1,2.25);render();return;}
 if(action==='zoomminus'){mapZoom=clamp(mapZoom-.25,1,2.25);render();return;}
 if(action==='rentalfocus'){selectedRental=id;notify('Rental selected. See its location on the 2D map.');render();return;}
 if(action==='rent'){startRental(id);afterAction();return;}
 if(action==='jumpmissions'){activePage='events';activeSub.events='challenges';render();return;}
 if(action==='toggleautocare'){if(!AUTO_CARE_ROWS.some(r=>r[0]===id)||!up(id))return;state.settings.autoCare={...state.settings.autoCare,[id]:!careSwitch(id)};notify(`${UPGRADES.find(x=>x.id===id).name} ${careSwitch(id)?'ON':'PAUSED'}.`);afterAction();return;}
 if(action==='toggleautodespatch'){if(!up('auto'))return;state.settings.autoDispatch=state.settings.autoDispatch===false;note(`Auto-Dispatch ${state.settings.autoDispatch?'enabled':'paused'} by the owner.`);notify(`Auto-Dispatch ${state.settings.autoDispatch?'ON':'PAUSED'}.`);afterAction();return;}
 if(action==='autorent'){let offer=state.offers.find(x=>bestCar(x));if(!offer){notify('No matching bookings for ready cars yet. Try refuelling or buying another car.','bad');return;}startRental(offer.id);afterAction();return;}
 if(action==='buycar'){addCar(id,null,false,dealerBranch);afterAction();return;}
 if(action==='modalbody')return;
 if(action==='bulkcare'){bulkCare(id);afterAction();return;}
 if(action==='asksell'){modalCar=id;modal='sell';render();return;}
 if(action==='confirmsell'){sellCar(id);afterAction();return;}
 if(action==='comparecar'){dealerCompare=dealerCompare.includes(id)?dealerCompare.filter(x=>x!==id):[...dealerCompare.slice(-1),id];render();return;}
 if(action==='clearcompare'){dealerCompare=[];render();return;}
 if(action==='openupgrade'){activePage='business';activeSub.business='upgrades';render();return;}
 if(action==='service'){service(id);afterAction();return;}
 if(action==='wash'){wash(id);afterAction();return;}
 if(action==='fuel'){fillFuel(id);afterAction();return;}
 if(action==='care'){allCare(id);afterAction();return;}
 if(action==='tune'){tune(id);afterAction();return;}
 if(action==='bodyrepair'){repairBody(id);afterAction();return;}
 if(action==='paintcar'){repaint(id,document.getElementById('paint-car-'+id)?.value);afterAction();return;}
 if(action==='transfer'){let select=document.getElementById('branch-car-'+id);transferCar(id,select?.value);afterAction();return;}
 if(action==='upgrade'){buyUpgrade(id);afterAction();return;}
 if(action==='branch'){buildBranch(id);afterAction();return;}
 if(action==='branchtransfer'){const el=document.querySelector('[data-role="branch-transfer-select"][data-id="'+id+'"]');if(!el?.value)return notify('Choose a parked vehicle to transfer.','bad');transferCar(el.value,id);afterAction();return;}
 if(action==='hire'){hire(id);afterAction();return;}
 if(action==='contract'){signContract(id);afterAction();return;}
 if(action==='loan'){takeLoan(id);afterAction();return;}
 if(action==='repayloan'){repayLoan(id);afterAction();return;}
 if(action==='exportledger'){exportLedger();return;}
 if(action==='resolve'){resolveIncident(id);afterAction();return;}
 if(action==='bid'){bidAuction();afterAction();return;}
 if(action==='buynow'){buyAuctionNow();afterAction();return;}
 if(action==='export'){exportSave();return;}
 if(action==='maptheme'){if(['auto','day','night'].includes(id))state.settings.mapTheme=id;afterAction();return;}
 if(action==='claimmission'){claimMission(id);afterAction();return;}
 if(action==='toggleofflineearnings'){state.settings.offlineEarnings=state.settings.offlineEarnings===false;state.offlineLastActiveAt=now();note(`Offline earnings ${state.settings.offlineEarnings?'enabled':'paused'} by the owner.`);notify(`Earn while away ${state.settings.offlineEarnings?'ON':'OFF'}.`);afterAction();return;}
 if(action==='saveslot'){saveToSlot(Number(id));render();return;}
 if(action==='loadslot'){modalCar=id;modal='loadslot';render();return;}
 if(action==='confirmloadslot'){restoreSlot(Number(id));afterAction();return;}
 if(action==='reset'){modal='reset';render();return;}
 if(action==='confirmreset'){state=fresh();state.offers=[];state.auction=null;activePage='overview';selectedCar=state.fleet[0]?.id;modal=null;initialize();notify('New company started!');afterAction();return;}
 if(action==='prestige'){modal='prestige';render();return;}
 if(action==='confirmprestige'){prestigeRun();afterAction();return;}
 if(action==='perk'){buyPerk(id);afterAction();return;}
});
document.getElementById('app').addEventListener('change',e=>{const el=e.target;if(el.id==='import-save'){importSaveFile(el.files?.[0]);return;}if(el.dataset.role==='garage-status'){garageStatus=el.value;render();return;}if(el.dataset.role==='garage-branch'){garageBranch=el.value;render();return;}if(el.dataset.role==='garage-sort'){garageSort=el.value;render();return;}if(el.dataset.role==='dealer-class'){dealerClass=el.value;render();return;}if(el.dataset.role==='dealer-sort'){dealerSort=el.value;render();return;}if(el.dataset.role==='dealer-branch'){dealerBranch=el.value;return;}if(el.dataset.role==='finance-filter'){financeFilter=el.value;render();return;}if(el.dataset.role==='difficulty'){if(DIFFICULTIES[el.value]){state.difficulty=el.value;note('Difficulty changed to '+difficulty().name+'.');afterAction();}return;}if(el.id==='company-name'){state.companyName=el.value.trim().slice(0,36)||'Coastline Rentals';afterAction();return;}});
document.getElementById('app').addEventListener('click',e=>{const s=e.target.closest('.garage-filters > summary');if(s)garageFiltersOpen=!s.parentElement.open;},true);
document.getElementById('app').addEventListener('input',e=>{if(e.target.dataset.role!=='garage-search')return;garageSearch=e.target.value;let q=garageSearch.trim().toLowerCase(),count=0;document.querySelectorAll('#fleet-results [data-fleet-search]').forEach(el=>{let visible=el.dataset.fleetSearch.includes(q);el.style.display=visible?'':'none';if(visible)count++;});document.querySelectorAll('#fleet-results .empty-slot').forEach(el=>{el.style.display=q?'none':'';});let msg=document.querySelector('[data-search-empty]');if(msg)msg.style.display=count?'none':'block';let c=document.querySelector('[data-fleet-count]');if(c)c.textContent=count+' matching vehicles · Bulk services include parked vehicles only.';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render();}else if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-action]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){state.offlineLastActiveAt=now();save(true);}else{tick();render();}});window.addEventListener('beforeunload',()=>{state.offlineLastActiveAt=now();save(true);});
function uiSignature(){return [state.cash,state.day,state.weather,state.rentals.map(x=>x.id).join(','),state.offers.map(x=>x.id).join(','),state.auction?.id,state.auction?.highest,state.auction?.bidder,state.fleet.map(c=>[c.status,c.branch,round(c.fuel),round(c.condition),round(c.clean),round(c.body)].join(':')).join(','),state.incidents.length,state.log[0]?.id].join('|');}
function refreshLive(){let t=now();document.querySelectorAll('[data-countdown-rental]').forEach(el=>{let r=state.rentals.find(x=>x.id===el.dataset.countdownRental);if(r)el.textContent=relativeTime(r.due);});document.querySelectorAll('[data-rental-progress]').forEach(el=>{let r=state.rentals.find(x=>x.id===el.dataset.rentalProgress);if(r)el.style.width=clamp((t-r.start)/(r.due-r.start)*100)+'%';});document.querySelectorAll('[data-countdown-offer]').forEach(el=>{let o=state.offers.find(x=>x.id===el.dataset.countdownOffer);if(o)el.textContent=relativeTime(o.expires);});document.querySelectorAll('[data-contract-countdown]').forEach(el=>{let c=CONTRACTS.find(x=>x.id===el.dataset.contractCountdown);if(c)el.textContent=Math.max(0,Math.ceil((c.period*1000-(t-(state.contractLast[c.id]||0)))/1000))+'s';});document.querySelectorAll('[data-countdown-auction]').forEach(el=>{if(state.auction)el.textContent=relativeTime(state.auction.ends);});document.querySelectorAll('[data-mapcar]').forEach(el=>{let r=state.rentals.find(x=>x.id===el.dataset.mapcar);if(r){let p=routePosition(r,t);el.setAttribute('transform',mapCarPose(r,t,state.fleet.find(c=>c.id===r.carId)?.type));}});}
let needsRender=false;
 document.getElementById('app').addEventListener('focusout',e=>{
  if(e.target.matches('input,select,textarea')&&needsRender){queueMicrotask(()=>{if(!document.activeElement?.matches('input,select,textarea')&&needsRender){needsRender=false;render();}});}
 });
 setInterval(()=>{let before=uiSignature();tick();if(uiSignature()!==before){if(document.activeElement?.matches('select,input,textarea')){needsRender=true;refreshLive();}else{needsRender=false;render();}}else if(needsRender&&!document.activeElement?.matches('select,input,textarea')){needsRender=false;render();}else refreshLive();},600);

window.__CTR_TEST__={offlineReport:()=>lastOfflineReport,offlineLimitMs:OFFLINE_LIMIT_MS,snapshot:()=>JSON.parse(JSON.stringify(state)),findRental:id=>state.rentals.find(r=>r.id===id)||null,map2d:()=>({mode:"2d",rentals:state.rentals.length}),readSave:()=>{try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}};

<script id="ctr-landscape-scroll-fix">
(function(){
  const landscapePhone = () => window.matchMedia('(hover:none) and (pointer:coarse) and (orientation:landscape)').matches;
  const keepWithinScreen=()=>{
    if(!landscapePhone())return;
    if(window.scrollX > 0)window.scrollTo({left:0,top:window.scrollY,behavior:'instant'});
  };
  window.addEventListener('pageshow',keepWithinScreen,{passive:true});
  window.addEventListener('orientationchange',keepWithinScreen,{passive:true});
  window.addEventListener('resize',keepWithinScreen,{passive:true});
})();
</script>
