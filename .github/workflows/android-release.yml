name: Build and publish Android APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
concurrency:
  group: cape-town-rentals-android-production
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sync game into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp manifest.webmanifest android/app/src/main/assets/manifest.webmanifest
      - name: Build test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload temporary test APK
        uses: actions/upload-artifact@v4
        with:
          name: Cape-Town-Rentals-Debug-Test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Check release signing secrets
        id: signing
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [[ -n "$APK_KEYSTORE_BASE64" && -n "$APK_KEYSTORE_PASSWORD" && -n "$APK_KEY_ALIAS" && -n "$APK_KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Production release skipped: configure four APK signing secrets in repository Settings.'
          fi
      - name: Restore signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cape-town-rentals-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cape-town-rentals-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Publish new GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk Cape-Town-Rentals-Android.apk
          printf 'Cape Town Rentals Modern Arcade, portrait Android, build %s.\nSigned APK update for existing players.\nExport saves regularly.\nCommit %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > release-notes.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Cape-Town-Rentals-Android.apk --clobber
          else
            gh release create "$tag" Cape-Town-Rentals-Android.apk --title "Cape Town Rentals Android $tag" --notes-file release-notes.txt --latest
          fi
