name: Fleet integrity checks (no release)
on:
  push:
    branches:
      - main
      - pre-release
      - 'feature/fleet-audit-cleanup-auctions'
    paths:
      - 'index.html'
      - 'assets/**'
      - 'icons/**'
      - 'rebuild.py'
      - 'tests/**'
      - 'android/**'
      - '.github/workflows/fleet-integrity.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fleet-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Verify Javascript syntax, classes, customer rules and 62 auction scenarios
        run: node tests/fleet-audit.test.mjs
      - name: Verify Android in-app updater download and APK safeguards
        run: node tests/android-updater.test.mjs
      - name: Verify all 17 contracts and fair booking rotation
        run: node tests/contracts-expansion.test.mjs
      - name: Verify Section 18 progress, achievements and save compatibility
        run: node tests/progress-section18.test.mjs
      - name: Verify Section 19 vehicle artwork, mapping and transparency
        run: node tests/vehicle-art-section19.test.mjs
      - name: Final QA save recovery and rental payout tests
        run: node tests/final-qa-section20.test.mjs
      - name: Rebuild the latest playable game, including all artwork
        run: python3 rebuild.py
      - name: Verify standalone game matches current source
        run: python3 tests/standalone-build.test.py
  android-debug:
    needs: fleet-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle current source into Android test assets
        run: |
          mkdir -p android/app/src/main/assets/assets android/app/src/main/assets/icons
          cp index.html android/app/src/main/assets/index.html
          cp -r assets/. android/app/src/main/assets/assets/
          cp -r icons/. android/app/src/main/assets/icons/
          cp manifest.webmanifest android/app/src/main/assets/manifest.webmanifest
      - name: Ensure every image exists
        run: |
          missing=0
          for f in $(grep -oE "(assets|icons)/[A-Za-z0-9_./-]+\.(png|webp|jpg|jpeg|svg|gif)" index.html | sort -u); do
            if [ ! -f "android/app/src/main/assets/$f" ]; then
              echo "::error::Missing asset: $f"; missing=1
            fi
          done
          exit $missing
      - name: Compile debug APK without publishing
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug


  mobile-ui:
    name: Android portrait screen audit
    needs: fleet-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install headless browser tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check all 21 game views at phone widths
        run: node tests/mobile-screen-audit.mjs
